<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JW.org What&rsquo;s New Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=80" />
  </head>
  <body>
    <div class="page-dimmer" id="pageDimmer" aria-hidden="true"></div>
    <main class="shell">
      <header class="top">
        <div class="brand">
          <div class="brand-row">
            <h1>JW.org What&rsquo;s New Tracker</h1>
          </div>
        </div>
        <section class="account" aria-label="Account">
          <div class="account-controls">
            <span class="sync-indicator" id="syncIndicator" role="img" aria-label="Everything synced" hidden>
              <svg class="sync-cloud-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7.2 18.5h10.1a4.2 4.2 0 0 0 .7-8.3A6.2 6.2 0 0 0 6.2 8.8a4.9 4.9 0 0 0 1 9.7Z"></path>
              </svg>
              <svg class="sync-spinner-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 7v5h-5"></path>
                <path d="M4 17v-5h5"></path>
                <path d="M6.1 8.2A7 7 0 0 1 18.8 7L20 12"></path>
                <path d="M17.9 15.8A7 7 0 0 1 5.2 17L4 12"></path>
              </svg>
            </span>
            <button
              class="profile-button"
              id="profileButton"
              type="button"
              aria-label="Open account menu"
              aria-expanded="false"
              aria-controls="accountMenu"
            >
              <svg class="profile-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="8" r="4"></circle>
                <path d="M4.5 20c.7-4.1 3.2-6.2 7.5-6.2s6.8 2.1 7.5 6.2"></path>
              </svg>
            </button>
          </div>
          <div class="account-menu" id="accountMenu" aria-hidden="true">
            <button class="sheet-close-button" id="sheetCloseButton" type="button" aria-label="Close account menu">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 6l12 12M18 6 6 18"></path>
              </svg>
            </button>
            <div class="account-content">
              <form class="sign-in-form" id="signInForm">
                <p>
                  Sign in to sync across devices.<br />
                  Enter your email below to receive a sign-in link.
                </p>
                <label class="sr-only" for="email">Email address</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="Email address" required />
                <button type="submit">Submit</button>
              </form>
              <div class="account-session" id="accountSession" hidden>
                <p class="account-identity">Signed in as <strong id="accountEmail"></strong></p>
                <button id="signOutButton" type="button">Sign out</button>
              </div>
              <p class="account-status" id="accountStatus" aria-live="polite"></p>
            </div>
          </div>
        </section>
      </header>

      <section class="stats" aria-label="Stats">
        <div class="stat"><b id="articlesToRead">0</b><small>Articles to read</small></div>
        <div class="stat"><b id="videosToWatch">0</b><small>Videos to watch</small></div>
      </section>

      <section class="toolbar" aria-label="Filters">
        <div class="segments" role="group" aria-label="List filter">
          <button data-filter="all" type="button">All</button>
          <button data-filter="articles" type="button">Articles</button>
          <button data-filter="videos" type="button">Videos</button>
          <button class="active" data-filter="unread" type="button">Unread</button>
        </div>
        <button class="reset-button" id="markAllUnread" type="button">Mark all as unread</button>
      </section>

      <section class="list" id="itemList" aria-label="Articles and videos"></section>
    </main>

    <script src="supabase.js"></script>
    <script src="script.js?v=80"></script>
  </body>
</html>
