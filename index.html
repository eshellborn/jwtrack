      :root {

        --muted: #6d747b;
        --line: #dfe3e6;
        --paper: #f7f7f4;
        --panel: #ffffff;
        --blue: #2f6f91;
        --blue-soft: #eaf3f7;
        --article: #2f6f91;
        --article-soft: #eaf3f7;
        --video: #7a5a9e;
        --video-soft: #f1edf7;
        --green: #25745d;
        --green-soft: #e8f4ee;
        --shadow: 0 10px 28px rgba(31, 35, 38, 0.08);
        color-scheme: light;
        font-family:
          "Inter", "Avenir Next", "SF Pro Display", "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--paper);
        color: var(--ink);
        font-weight: 400;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      button {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      a {
        color: inherit;
      }

      .shell {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 34px 0 48px;
        display: grid;
        gap: 24px;
      }

      .top {
        display: block;
      }

      .brand {
        display: grid;
        gap: 10px;
      }

      .brand-row {
        display: block;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(1.55rem, 3vw, 2.35rem);
        font-family: "Inter", "Avenir Next", sans-serif;
        font-weight: 600;
        letter-spacing: 0;
        line-height: 1.1;
      }

      .subtle {
        color: var(--muted);
        line-height: 1.5;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .stat {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.85) inset;
      }

      .stat b {
        display: block;
        height: 1em;
        overflow: hidden;
        font-size: 1.8rem;
        font-weight: 650;
        line-height: 1;
        margin-bottom: 6px;
      }

      .stat-number-track {
        display: grid;
        will-change: transform;
      }

      .stat-number-track span {
        display: block;
        height: 1em;
      }

      .stat small {
        color: var(--muted);
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .segments {
        position: relative;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        width: fit-content;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #eef0f1;
        padding: 4px;
      }

      .segments::before {
        content: "";
        position: absolute;
        left: var(--indicator-left, 4px);
        top: 4px;
        width: var(--indicator-width, 0px);
        height: calc(100% - 8px);
        border-radius: 6px;
        background: var(--panel);
        box-shadow:
          0 1px 2px rgba(31, 35, 38, 0.08),
          0 1px 0 rgba(255, 255, 255, 0.9) inset;
        transition:
          left 220ms cubic-bezier(0, 0, 0.28, 1),
          width 220ms cubic-bezier(0, 0, 0.28, 1);
      }

      .segments button {
        position: relative;
        z-index: 1;
        min-height: 34px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        padding: 0 14px;
        font-size: 0.92rem;
        font-weight: 600;
        transition:
          background-color 160ms ease,
          color 160ms ease,
          box-shadow 160ms ease;
      }

      .segments button.active {
        color: var(--ink);
      }

      .segments button:not(.active):hover {
        color: var(--ink);
        background: rgba(255, 255, 255, 0.46);
      }

      .reset-button {
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--panel);
        color: var(--muted);
        padding: 0 14px;
        font-size: 0.88rem;
        font-weight: 600;
        transition:
          border-color 160ms ease,
          color 160ms ease,
          background-color 160ms ease;
      }

      .reset-button:hover:not(:disabled) {
        border-color: #bfc7cc;
        background: #fbfbfa;
        color: var(--ink);
      }

      .reset-button:disabled {
        cursor: default;
        opacity: 0.45;
      }

      .list {
        position: relative;
        display: grid;
        gap: 12px;
      }

      .item {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 5px 16px rgba(31, 35, 38, 0.05);
        touch-action: pan-y;
      }

      .item::before {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--green-soft);
        opacity: 0;
        transition: opacity 140ms ease;
      }

      .item.swiping::before {
        opacity: 1;
      }

      .item.done {
        background: #eef7f2;
        border-color: #7cb39b;
      }

      .item.marking-done {
        animation: completedColorIn 260ms cubic-bezier(0, 0, 0.28, 1) both;
      }

      .item.marking-open {
        animation: completedColorOut 260ms cubic-bezier(0, 0, 0.28, 1) both;
      }

      .item.removing {
        animation: itemExit 300ms cubic-bezier(0, 0, 0.28, 1) forwards;
        pointer-events: none;
        will-change: opacity;
      }

      .item.done h3,
      .item.marking-done h3 {
        color: #4e5d56;
      }

      .item.marking-open h3 {
        color: var(--ink);
      }

      .item.done .desc,
      .item.done .meta {
        opacity: 0.72;
      }

      .item.marking-open .desc,
      .item.marking-open .meta {
        opacity: 1;
      }

      .item.done .item-main {
        transform: scale(0.985);
        transform-origin: center;
      }

      .item.marking-done .item-main {
        animation: contentShrink 260ms cubic-bezier(0, 0, 0.28, 1) both;
        transform-origin: center;
      }

      .item.marking-open .item-main {
        animation: contentGrow 260ms cubic-bezier(0, 0, 0.28, 1) both;
        transform-origin: center;
      }

      .item-row {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 18px;
        align-items: center;
        padding: 18px;
        background: inherit;
        transition: transform 140ms ease;
      }

      .item.swiping .item-row {
        transform: translateX(18px);
      }

      .item-main {
        min-width: 0;
        display: grid;
        gap: 9px;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 0.84rem;
        transition: opacity 260ms cubic-bezier(0, 0, 0.28, 1);
      }

      .meta + h3 {
        margin-top: 8px;
      }

      .pill {
        display: inline-flex;
        min-height: 24px;
        align-items: center;
        padding: 0 8px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 650;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .pill.article {
        background: var(--article-soft);
        color: var(--article);
      }

      .pill.video {
        background: var(--video-soft);
        color: var(--video);
      }

      .date {
        color: var(--muted);
        font-size: 0.84rem;
        font-weight: 500;
      }

      .category {
        display: inline-flex;
        min-height: 24px;
        align-items: center;
        border-radius: 999px;
        background: #eef0f1;
        color: var(--muted);
        padding: 0 8px;
        font-size: 0.75rem;
        font-weight: 600;
      }

      h3 {
        font-size: 1rem;
        font-weight: 600;
        line-height: 1.35;
        color: var(--ink);
        transition: color 260ms cubic-bezier(0, 0, 0.28, 1);
      }

      h3 a {
        position: relative;
        text-decoration: none;
        text-decoration-thickness: 1px;
        text-underline-offset: 4px;
      }

      .item.done h3 a::after,
      .item.marking-done h3 a::after {
        content: none;
      }

      .title-line {
        display: inline;
        white-space: pre-wrap;
        background-image: linear-gradient(rgba(37, 116, 93, 0.55), rgba(37, 116, 93, 0.55));
        background-position: 0 55%;
        background-repeat: no-repeat;
        background-size: 0 2px;
        -webkit-box-decoration-break: clone;
        box-decoration-break: clone;
      }

      .item.done .title-line,
      .item.marking-done .title-line {
        background-size: 100% 2px;
      }

      .item.marking-open .title-line {
        background-size: 0 2px;
      }

      h3 a:hover {
        color: var(--blue);
      }

      .desc {
        color: var(--muted);
        line-height: 1.45;
        transition: opacity 260ms cubic-bezier(0, 0, 0.28, 1);
      }

      .complete-button {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: #fbfbfa;
        color: var(--muted);
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        transition:
          background-color 260ms cubic-bezier(0, 0, 0.28, 1),
          border-color 260ms cubic-bezier(0, 0, 0.28, 1),
          color 260ms cubic-bezier(0, 0, 0.28, 1);
      }

      .complete-button::before {
        content: "";
        width: 9px;
        height: 16px;
        border: solid currentColor;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg) translate(-1px, -1px);
        opacity: 0.7;
      }

      .item.done .complete-button,
      .item.marking-done .complete-button {
        background: var(--green);
        border-color: var(--green);
        color: white;
      }

      .item.marking-open .complete-button {
        background: #fbfbfa;
        border-color: var(--line);
        color: var(--muted);
      }

      .empty {
        border: 1px dashed var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--muted);
        padding: 34px;
        text-align: center;
      }

      @keyframes contentShrink {
        0% {
          transform: scale(1);
        }

        100% {
          transform: scale(0.985);
        }
      }

      @keyframes completedColorIn {
        0% {
          background: var(--panel);
          border-color: var(--line);
        }

        100% {
          background: #eef7f2;
          border-color: #7cb39b;
        }
      }

      @keyframes completedColorOut {
        0% {
          background: #eef7f2;
          border-color: #7cb39b;
        }

        100% {
          background: var(--panel);
          border-color: var(--line);
        }
      }

      @keyframes itemExit {
        0% {
          opacity: 1;
        }

        100% {
          opacity: 0;
        }
      }

      @keyframes contentGrow {
        0% {
          transform: scale(0.985);
        }

        100% {
          transform: scale(1);
        }
      }

      @media (max-width: 820px) {
        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 560px) {
        .shell {
          width: min(100% - 24px, 1120px);
          padding-top: 22px;
          gap: 20px;
        }

        .item-row {
          grid-template-columns: minmax(0, 1fr) 42px;
          gap: 14px;
          padding: 15px;
        }

        .stats {
          gap: 10px;
        }

        .stat {
          padding: 14px;
        }
      }
    </style>
  </head>

      const storageKey = "jw-whats-new-tracker-v5";
      const state = {
        filter: "all",
        progress: loadProgress(),
        swipeStart: null
      };

      const listEl = document.querySelector("#itemList");
      const segmentsEl = document.querySelector(".segments");
      const markAllUnreadButton = document.querySelector("#markAllUnread");
      function loadProgress() {
        try {
          return JSON.parse(localStorage.getItem(storageKey)) || {};
        } catch {
          return {};
        }
      }

      function saveProgress() {
        localStorage.setItem(storageKey, JSON.stringify(state.progress));
      }

      function isDone(id) {
        return Boolean(state.progress[id]);
      }

      function setDone(id, done) {
        if (done) {
          state.progress[id] = true;
        } else {
          delete state.progress[id];
        }
        saveProgress();
      }

      function formatDate(value) {
        return new Intl.DateTimeFormat("en", {
          month: "short",
          day: "numeric",
          year: "numeric"
        }).format(new Date(`${value}T12:00:00`));
      }

      function sortByNewestFirst(itemA, itemB) {
        return itemB.date.localeCompare(itemA.date);
      }

      function filteredItems() {
        return items
          .filter((item) => {
            const done = isDone(item.id);
            if (state.filter === "unread") return !done;
            if (state.filter === "videos") return item.type === "video";
            if (state.filter === "articles") return item.type === "article";
            return true;
          })
          .sort(sortByNewestFirst);
      }

      function render() {
        const visible = filteredItems();
        renderStats();
        renderList(visible);
        updateFilterIndicator();
        markAllUnreadButton.disabled = !items.some((item) => isDone(item.id));
      }

      function renderStats() {
        const stats = items.reduce(
          (acc, item) => {
            const done = isDone(item.id);
            if (item.type === "video") {
              if (!done) acc.videosToWatch += 1;
            } else {
              if (!done) acc.articlesToRead += 1;
            }
            return acc;
          },
          {
            articlesToRead: 0,
            videosToWatch: 0
          }
        );

        animateStatNumber(document.querySelector("#articlesToRead"), stats.articlesToRead);
        animateStatNumber(document.querySelector("#videosToWatch"), stats.videosToWatch);
      }

      function animateStatNumber(element, nextValue) {
        const currentValue = Number(element.dataset.value ?? element.textContent);
        if (currentValue === nextValue) return;

        element.dataset.value = nextValue;
        element.setAttribute("aria-label", String(nextValue));

        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          element.textContent = nextValue;
          return;
        }

        const increasing = nextValue > currentValue;
        const track = document.createElement("span");
        const oldNumber = document.createElement("span");
        const newNumber = document.createElement("span");
        track.className = "stat-number-track";
        oldNumber.textContent = currentValue;
        newNumber.textContent = nextValue;
        oldNumber.setAttribute("aria-hidden", "true");
        newNumber.setAttribute("aria-hidden", "true");
        track.append(...(increasing ? [newNumber, oldNumber] : [oldNumber, newNumber]));
        element.replaceChildren(track);

        const animation = track.animate(
          increasing
            ? [{ transform: "translateY(-50%)" }, { transform: "translateY(0)" }]
            : [{ transform: "translateY(0)" }, { transform: "translateY(-50%)" }],
          {
            duration: 380,
            easing: "cubic-bezier(0.22, 1, 0.36, 1)"
          }
        );

        animation.addEventListener("finish", () => {
          if (Number(element.dataset.value) === nextValue) {
            element.textContent = nextValue;
          }
        });
      }

      function renderList(visible) {
        if (!visible.length) {
          listEl.innerHTML = `<div class="empty">No items match this filter.</div>`;
          return;
        }

        listEl.innerHTML = visible
          .map((item) => {
            const done = isDone(item.id);
            return `
              <article class="item ${done ? "done" : ""}" data-id="${item.id}">
                <div class="item-row">
                  <div class="item-main">
                    <div class="meta">
                      <span class="pill ${item.type}">${item.type}</span>
                      <span class="category">${item.category}</span>
                    </div>
                    <h3><a href="${item.url}" target="_blank" rel="noreferrer">${item.title}</a></h3>
                    <span class="date">${formatDate(item.date)}</span>
                    ${item.description && item.type !== "video" ? `<p class="desc">${item.description}</p>` : ""}
                  </div>
                  <button class="complete-button" data-id="${item.id}" type="button" aria-label="${done ? "Mark open" : "Mark complete"}"></button>
                </div>
              </article>
            `;
          })
          .join("");
        wrapTitleLines();
      }

      function wrapTitleLines() {
        listEl.querySelectorAll("h3 a").forEach((link) => {
          const title = link.textContent.trim();
          link.dataset.title = title;
          link.textContent = "";

          const words = title.split(/\s+/);
          const wordSpans = words.map((word, index) => {
            const span = document.createElement("span");
            span.textContent = `${word}${index < words.length - 1 ? " " : ""}`;
            link.append(span);
            return span;
          });

          const lines = [];
          wordSpans.forEach((span) => {
            const top = Math.round(span.offsetTop);
            const currentLine = lines.at(-1);
            if (!currentLine || Math.abs(currentLine.top - top) > 2) {
              lines.push({ top, text: span.textContent });
            } else {
              currentLine.text += span.textContent;
            }
          });

          link.textContent = "";
          const lastLineIndex = Math.max(lines.length - 1, 0);
          lines.forEach((line, index) => {
            const span = document.createElement("span");
            span.className = "title-line";
            span.textContent = line.text;
            span.style.setProperty("--line-index", index);
            span.style.setProperty("--reverse-line-index", lastLineIndex - index);
            link.append(span);
          });
        });
      }

      function easeCompletion(value) {
        const inverse = 1 - value;
        return 1 - inverse * inverse * inverse;
      }

      function setStrikeProgress(lines, progress) {
        const lineWidths = lines.map((line) => line.getBoundingClientRect().width);
        const totalWidth = lineWidths.reduce((sum, width) => sum + width, 0);
        let completedWidth = progress * totalWidth;

        lines.forEach((line, index) => {
          const lineWidth = lineWidths[index] || 1;
          const fill = Math.max(0, Math.min(1, completedWidth / lineWidth));
          line.style.backgroundSize = `${fill * 100}% 2px`;
          completedWidth -= lineWidth;
        });
      }

      function animateTitleStrike(item, done) {
        const lines = Array.from(item?.querySelectorAll(".title-line") || []);
        if (!lines.length) return;

        const duration = 260;
        const startedAt = performance.now();
        setStrikeProgress(lines, done ? 0 : 1);

        function step(now) {
          const elapsed = Math.min((now - startedAt) / duration, 1);
          const eased = easeCompletion(elapsed);
          setStrikeProgress(lines, done ? eased : 1 - eased);
          if (elapsed < 1) {
            requestAnimationFrame(step);
          }
        }

        requestAnimationFrame(step);
      }

      function completionDelayFor(item) {
        return 260;
      }

      function animateUnreadRemoval(item, id) {
        const previousRects = new Map(
          Array.from(listEl.querySelectorAll(".item")).map((node) => [
            node.dataset.id,
            node.getBoundingClientRect()
          ])
        );

        item.classList.remove("marking-done");
        item.classList.add("done", "removing");

        const finishRemoval = (event) => {
          if (event.target !== item || event.animationName !== "itemExit") return;
          item.removeEventListener("animationend", finishRemoval);
          setDone(id, true);
          render();

          listEl.querySelectorAll(".item").forEach((node) => {
            const previousRect = previousRects.get(node.dataset.id);
            if (!previousRect) return;
            const currentRect = node.getBoundingClientRect();
            const deltaX = previousRect.left - currentRect.left;
            const deltaY = previousRect.top - currentRect.top;
            if (!deltaX && !deltaY) return;

            node.animate(
              [
                { transform: `translate(${deltaX}px, ${deltaY}px)` },
                { transform: "translate(0, 0)" }
              ],
              {
                duration: 320,
                easing: "cubic-bezier(0, 0, 0.28, 1)"
              }
            );
          });
        };

        item.addEventListener("animationend", finishRemoval);
      }

      function toggleItem(id) {
        const nextDone = !isDone(id);

        if (nextDone) {
          const item = listEl.querySelector(`[data-id="${id}"]`);
          item?.classList.add("marking-done");
          animateTitleStrike(item, true);
          window.setTimeout(() => {
            if (state.filter === "unread" && item) {
              animateUnreadRemoval(item, id);
              return;
            }
            setDone(id, true);
            render();
          }, completionDelayFor(item));
          return;
        }

        const item = listEl.querySelector(`[data-id="${id}"]`);
        item?.classList.add("marking-open");
        animateTitleStrike(item, false);
        window.setTimeout(() => {
          setDone(id, false);
          render();
        }, completionDelayFor(item));
      }

      function updateFilterIndicator() {
        const activeButton = segmentsEl.querySelector("button.active");
        if (!activeButton) return;
        segmentsEl.style.setProperty("--indicator-left", `${activeButton.offsetLeft}px`);
        segmentsEl.style.setProperty("--indicator-width", `${activeButton.offsetWidth}px`);
      }

      document.querySelector(".segments").addEventListener("click", (event) => {
        const button = event.target.closest("button[data-filter]");
        if (!button) return;
        document.querySelectorAll(".segments button").forEach((node) => node.classList.remove("active"));
        button.classList.add("active");
        state.filter = button.dataset.filter;
        render();
        updateFilterIndicator();
      });

      markAllUnreadButton.addEventListener("click", () => {
        state.progress = {};
        saveProgress();
        render();
      });

      window.addEventListener("resize", () => {
        window.clearTimeout(wrapTitleLines.resizeTimer);
        wrapTitleLines.resizeTimer = window.setTimeout(() => {
          wrapTitleLines();
          updateFilterIndicator();
        }, 120);
      });

      listEl.addEventListener("click", (event) => {
        const button = event.target.closest(".complete-button");
        if (!button) return;
        toggleItem(button.dataset.id);
      });

      listEl.addEventListener("pointerdown", (event) => {
        const item = event.target.closest(".item");
        if (!item || event.target.closest("a, button")) return;
        state.swipeStart = {
          id: item.dataset.id,
          x: event.clientX,
          y: event.clientY
        };
      });

      listEl.addEventListener("pointermove", (event) => {
        if (!state.swipeStart) return;
        const dx = event.clientX - state.swipeStart.x;
        const dy = event.clientY - state.swipeStart.y;
        const item = listEl.querySelector(`[data-id="${state.swipeStart.id}"]`);
        if (item && Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          item.classList.add("swiping");
        }
      });

      listEl.addEventListener("pointerup", (event) => {
        if (!state.swipeStart) return;
        const dx = event.clientX - state.swipeStart.x;
        const dy = event.clientY - state.swipeStart.y;
        const id = state.swipeStart.id;
        state.swipeStart = null;
        document.querySelectorAll(".item.swiping").forEach((item) => item.classList.remove("swiping"));
        if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          toggleItem(id);
        }
      });

      listEl.addEventListener("pointercancel", () => {
        state.swipeStart = null;
        document.querySelectorAll(".item.swiping").forEach((item) => item.classList.remove("swiping"));
      });

      render();
    </script>
  </body>
</html>
