name: Sync JW.org content

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check for updates without saving or emailing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-jw-content
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://fgikbmwjdentpumhdzeu.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test feed parser
        run: npm test

        
      - name: Test JW.org RSS feed
        if: github.event_name == 'workflow_dispatch'
        run: |
          node --input-type=module <<'NODE'
          import * as cheerio from "cheerio";

          const url = "https://www.jw.org/en/whats-new/rss/WhatsNewWebArticles/feed.xml";

          const response = await fetch(url, {
            headers: {
              Accept: "application/rss+xml,application/xml,text/xml",
              "User-Agent": "JWTrack/1.0"
            }
          });

          const xml = await response.text();
          const $ = cheerio.load(xml, { xmlMode: true });
          const items = $("channel > item");

          console.log("RSS HTTP status:", response.status);
          console.log("RSS content type:", response.headers.get("content-type"));
          console.log("RSS response size:", xml.length);
          console.log("RSS articles found:", items.length);

          items.slice(0, 3).each((i, item) => {
            const entry = $(item);
            console.log({
              guid: entry.find("guid").text().trim(),
              title: entry.find("title").text().trim(),
              pubDate: entry.find("pubDate").text().trim()
            });
          });

          if (!response.ok || items.length === 0) {
            throw new Error("RSS feed test failed.");
          }
          NODE


      - name: Sync content
        run: npm run sync -- ${{ inputs.dry_run && '--dry-run' || '' }}
